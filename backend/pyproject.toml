[project]
name = "khis-backend"
version = "1.0.0"
description = "Kidney Health Intelligence System API"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<5.2",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.4",
  "django-filter>=24.3",
  "Pillow>=10.4",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "pypdf>=4.3",
  "openai>=1.40",
  "cryptography>=43.0",
  "python-dotenv>=1.0",
  "whitenoise>=6.7",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "drf-spectacular>=0.27",
  "django-environ>=0.11",
  "httpx>=0.27",
  "numpy>=2.0",
]

[tool.vercel]
entrypoint = "khis.wsgi:application"
